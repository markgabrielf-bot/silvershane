<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#F1F4F7; --surface:#FFFFFF; --ink:#16232F; --muted:#586878; --line:#D3DCE4;
  --brand:#0F5C6E; --brand-ink:#0A4453; --brand-soft:#DDEEF2;
  --ok:#1D7A4B; --ok-soft:#DCF1E4; --bad:#B0343F; --bad-soft:#F8DFE2; --warn:#8A5A00; --warn-soft:#FBEFD5;
  --head:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--body)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;font-weight:700}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid #E8A317;outline-offset:2px}
.muted{color:var(--muted)}
.wrap{max-width:880px;margin:0 auto;padding:0 1.25rem}
.main{padding-top:2rem;padding-bottom:4rem}
.page-title{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:.35rem}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar-in{display:flex;align-items:center;gap:1rem;min-height:60px;flex-wrap:wrap;padding-top:.35rem;padding-bottom:.35rem}
.brand{font:700 1.3rem var(--head);color:var(--brand);background:none;border:0;cursor:pointer;padding:0}
.topbar nav{display:flex;gap:.25rem;margin-right:auto}
.navlink{background:none;border:0;padding:.5rem .8rem;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px}
.navlink:hover{background:var(--brand-soft);color:var(--brand)}
.navlink.on{color:var(--brand);background:var(--brand-soft)}
.who{display:flex;align-items:center;gap:.5rem;font-size:.95rem;color:var(--muted)}

/* buttons and fields */
.btn{font:700 1rem var(--body);padding:.65rem 1.1rem;border-radius:10px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);cursor:pointer;min-height:44px}
.btn:hover{background:var(--brand-soft)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-ink)}
.btn-quiet{border-color:transparent;background:transparent}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-sm{padding:.4rem .8rem;min-height:38px;font-size:.95rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
label{display:block;font-weight:700;margin-bottom:.3rem}
input[type=text],input[type=email],input[type=password],textarea{width:100%;font:inherit;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:84px}
.field{margin-bottom:1rem}
.hint{font-size:.92rem;color:var(--muted);margin-top:.25rem}
.msg{min-height:1.4rem;margin:.25rem 0 .75rem;font-weight:700}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.links{display:flex;gap:1.25rem;flex-wrap:wrap;margin-top:1rem}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;cursor:pointer;font-size:1rem}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(300px,5fr) 6fr}
.auth-intro{background:var(--brand);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center;gap:1.25rem}
.auth-intro h1{font-size:clamp(2.2rem,5vw,3.2rem)}
.auth-intro p{max-width:34ch;opacity:.95}
.tiles{display:flex;gap:.6rem}
.tiles span{width:52px;height:52px;border:2px solid rgba(255,255,255,.55);border-radius:8px;display:grid;place-items:center;font:700 1.3rem var(--head)}
.tiles .hit{background:#fff;color:var(--brand);border-color:#fff}
.auth-form{padding:3rem 2rem;max-width:480px;width:100%;margin:auto}
.auth-form h2{font-size:1.8rem;margin-bottom:.4rem}
.auth-form .muted{margin-bottom:1.5rem}
@media (max-width:760px){
  .auth{grid-template-columns:1fr}
  .auth-intro{padding:2rem 1.5rem}
  .auth-form{padding:2rem 1.25rem}
}

/* dashboard */
.tests{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 1.25rem}
.test{display:grid;grid-template-columns:1fr auto;gap:.6rem 1.5rem;align-items:center;padding:1.25rem 0;border-top:1px solid var(--line)}
.test:first-child{border-top:0}
.test h3{font-size:1.25rem;margin-bottom:.15rem}
.test .desc{color:var(--muted);font-size:.98rem}
.test-actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.progress-row{display:flex;align-items:center;gap:.9rem;margin-top:.7rem}
.progress{flex:1;height:10px;background:var(--brand-soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.progress-row .label{font-size:.95rem;color:var(--muted);white-space:nowrap}
.progress-row .label b{color:var(--ink)}
@media (max-width:640px){
  .test{grid-template-columns:1fr}
  .test-actions{justify-content:flex-start}
  .progress-row{flex-wrap:wrap}
}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:2rem;text-align:center;color:var(--muted)}

/* quiz */
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem}
.quiz-title{font-size:1.3rem;color:var(--muted);font-weight:500;margin-bottom:.5rem}
.qpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(1.25rem,4vw,2rem);margin-top:1rem}
.qtext{font:500 clamp(1.35rem,3.6vw,1.85rem)/1.3 var(--head);white-space:pre-wrap;margin-bottom:1.5rem}
.choices{display:grid;gap:.7rem}
.choice{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:.9rem;text-align:left;width:100%;padding:.7rem .9rem .7rem .7rem;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:400 1.05rem/1.4 var(--body);cursor:pointer;min-height:58px}
.choice:hover:not(:disabled){border-color:var(--brand)}
.choice .letter{width:44px;height:44px;border-radius:8px;background:var(--paper);display:grid;place-items:center;font:700 1.15rem var(--head);color:var(--brand)}
.choice .tag{font-size:.88rem;font-weight:700;white-space:nowrap}
.choice.selected{border-color:var(--brand);background:var(--brand-soft)}
.choice.selected .letter{background:var(--brand);color:#fff}
.choice:disabled{cursor:default}
.choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.choice.correct .letter{background:var(--ok);color:#fff}
.choice.correct .tag{color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .letter{background:var(--bad);color:#fff}
.choice.wrong .tag{color:var(--bad)}
.feedback{margin-top:1.25rem;padding:1rem 1.1rem;border-radius:12px}
.feedback.good{background:var(--ok-soft);color:#0E4A2B}
.feedback.miss{background:var(--bad-soft);color:#6E1D26}
.feedback strong{font-family:var(--head);font-size:1.15rem;display:block;margin-bottom:.2rem}
.feedback p+p{margin-top:.4rem}
.qactions{margin-top:1.5rem;display:flex;justify-content:flex-end}
@media (max-width:520px){
  .choice{grid-template-columns:40px 1fr;}
  .choice .tag{grid-column:2}
  .choice .letter{width:40px;height:40px}
}

/* results */
.results{text-align:center;padding:2.25rem 1.25rem}
.score{font:700 clamp(3.2rem,12vw,5.5rem)/1 var(--head);color:var(--brand)}
.score small{font-size:.4em;color:var(--muted);font-weight:500}
.results .row{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}
.review{margin-top:2rem;text-align:left}
.review h2{font-size:1.4rem;margin-bottom:1rem;text-align:center}
.miss-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:.8rem}
.miss-item .q{font-weight:700;white-space:pre-wrap;margin-bottom:.5rem}
.miss-item .yours{color:var(--bad)}
.miss-item .right{color:var(--ok)}
.miss-item .why{margin-top:.5rem;color:var(--muted)}

/* admin */
.pill{display:inline-block;padding:.1rem .65rem;border-radius:99px;font-size:.85rem;font-weight:700;margin-left:.5rem;vertical-align:middle}
.pill.pub{background:var(--ok-soft);color:var(--ok)}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-bottom:1.25rem}
.panel h2{font-size:1.3rem;margin-bottom:.35rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.import-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-top:1rem}
@media (max-width:700px){.import-grid{grid-template-columns:1fr}}
input[type=file]{font:inherit;max-width:100%}
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.qcard.has-err{border-color:var(--bad)}
.qcard-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.qcard-head h3{font-size:1.1rem}
.choice-edit{display:grid;grid-template-columns:auto 34px 1fr;gap:.6rem;align-items:center;margin-bottom:.5rem}
.choice-edit .letter{width:34px;height:34px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font:700 1rem var(--head);color:var(--brand)}
.choice-edit input[type=radio]{width:22px;height:22px;accent-color:var(--brand)}
fieldset{border:0;padding:0;margin:0 0 1rem}
legend{font-weight:700;margin-bottom:.4rem;padding:0}
.qerr{color:var(--bad);font-weight:700;margin-top:.5rem;min-height:0}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-top:1.5rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.adm-row{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;align-items:center;padding:1rem 0;border-top:1px solid var(--line)}
.adm-row:first-child{border-top:0}
.adm-row h3{font-size:1.15rem}
@media (max-width:640px){.adm-row{grid-template-columns:1fr}}

/* toast */
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.toast.good{background:var(--ok)}
.setup{max-width:640px;margin:4rem auto;padding:0 1.25rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem">This site needs JavaScript to run.</p></noscript>

<script>
(function () {
'use strict';

/* ============ CONFIG: paste your own values here ============ */
const SUPABASE_URL = "https://iobcybumigiiodsxzhgi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vFM7xQNpqnu3wHvA3laejQ_XFqppJ7Q";
const APP_NAME = "Silver Shane Reviewer";
/* ============================================================ */

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
document.title = APP_NAME;

if (SUPABASE_URL.indexOf('PASTE_') === 0 || SUPABASE_ANON_KEY.indexOf('PASTE_') === 0) {
  app.innerHTML = '<div class="setup"><h1>Almost there</h1><p style="margin-top:.75rem">Open <b>index.html</b> in a text editor and paste your Supabase project URL and anon key near the top of the script, where it says CONFIG. Then upload the file again.</p></div>';
  return;
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = { session: null, userId: null, profile: null, view: 'loading', quiz: null, ed: null, busy: false, pendingEmail: '' };
let keySeq = 0;
const newKey = () => 'k' + (++keySeq);
const LETTERS = ['A', 'B', 'C', 'D'];

/* ---------------- helpers ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, kind) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + (kind || '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { toastEl.className = 'toast'; }, 4200);
}
function unwrap(r) { if (r.error) throw r.error; return r.data; }
function friendly(err) {
  const m = (err && err.message) || '';
  if (/invalid login/i.test(m)) return 'Email or password is incorrect.';
  if (/not confirmed/i.test(m)) return 'Confirm your email first. Check your inbox for the confirmation link.';
  if (/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a few minutes and try again.';
  if (/password should be at least/i.test(m)) return 'Password must be at least 8 characters.';
  if (/failed to fetch|network/i.test(m)) return 'Could not connect. Check your internet and try again.';
  return m || 'Something went wrong. Try again.';
}
function pageUrl() { return window.location.origin + window.location.pathname; }
function go(view) { state.view = view; render(); window.scrollTo(0, 0); }
function displayName() {
  const p = state.profile || {};
  return p.full_name || p.email || (state.session && state.session.user && state.session.user.email) || '';
}
function loading(active) {
  app.innerHTML = shell('<p class="muted">Loading...</p>', active);
}

/* --- Randomization Helpers --- */
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function seededShuffle(array, seed) {
  let m = 0x80000000, a = 1103515245, c = 12345;
  let stateVal = seed;
  const nextRandom = () => {
    stateVal = (a * stateVal + c) % m;
    return stateVal / (m - 1);
  };

  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(nextRandom() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
/* ------------------------------------------- */

/* ---------------- shell ---------------- */
function shell(inner, active) {
  const admin = state.profile && state.profile.is_admin;
  return `<header class="topbar"><div class="wrap topbar-in">
    <button class="brand" data-act="go" data-view="dashboard">${esc(APP_NAME)}</button>
    <nav aria-label="Main">
      <button class="navlink ${active === 'dashboard' ? 'on' : ''}" data-act="go" data-view="dashboard">My tests</button>
      ${admin ? `<button class="navlink ${active === 'admin' ? 'on' : ''}" data-act="go" data-view="admin">Admin</button>` : ''}
    </nav>
    <div class="who"><span>${esc(displayName())}</span><button class="btn btn-quiet btn-sm" data-act="signout">Log out</button></div>
  </div></header><main class="wrap main">${inner}</main>`;
}

/* ---------------- auth views ---------------- */
function authFrame(title, sub, body) {
  app.innerHTML = `<div class="auth">
    <section class="auth-intro">
      <div class="tiles" aria-hidden="true"><span>A</span><span>B</span><span class="hit">C</span><span>D</span></div>
      <h1>${esc(APP_NAME)}</h1>
      <p>Answer practice questions at your own pace. Your progress is saved after every question, so you can stop and continue anytime.</p>
    </section>
    <section class="auth-form"><h2>${title}</h2>${sub ? `<p class="muted">${sub}</p>` : ''}${body}</section>
  </div>`;
}
function viewLogin() {
  authFrame('Log in', 'Welcome back.', `
    <form data-form="login" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p class="msg" role="alert"></p>
      <button class="btn btn-primary" type="submit">Log in</button>
      <div class="links">
        <button type="button" class="linkbtn" data-act="go" data-view="forgot">Forgot password?</button>
        <button type="button" class="linkbtn" data-act="go" data-view="signup">Create an account</button>
      </div>
    </form>`);
}
function viewSignup() {
  authFrame('Create your account', 'We will email you a link to confirm it.', `
    <form data-form="signup" novalidate>
      <div class="field"><label for="full_name">Name</label><input id="full_name" name="full_name" type="text" autocomplete="name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required><p class="hint">At least 8 characters.</p></div>
      <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
      <p class="msg" role="alert"></p>
      <button class="btn btn-primary" type="submit">Create account</button>
      <div class="links"><button type="button" class="linkbtn" data-act="go" data-view="login">I already have an account</button></div>
    </form>`);
}
function viewSignupDone() {
  authFrame('Check your email', '', `
    <p>We sent a confirmation link to <b>${esc(state.pendingEmail)}</b>. Open it to activate your account, then log in.</p>
    <p class="hint" style="margin-top:.6rem">Nothing there? Check your spam folder.</p>
    <div class="links"><button class="btn btn-primary" data-act="go" data-view="login">Go to log in</button></div>`);
}
function viewForgot() {
  authFrame('Reset your password', 'Enter your email and we will send you a reset link.', `
    <form data-form="forgot" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <p class="msg" role="alert"></p>
      <button class="btn btn-primary" type="submit">Send reset link</button>
      <div class="links"><button type="button" class="linkbtn" data-act="go" data-view="login">Back to log in</button></div>
    </form>`);
}
function viewReset() {
  authFrame('Choose a new password', '', `
    <form data-form="reset" novalidate>
      <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required><p class="hint">At least 8 characters.</p></div>
      <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
      <p class="msg" role="alert"></p>
      <button class="btn btn-primary" type="submit">Save new password</button>
    </form>`);
}

const forms = {
  async login(f) {
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (error) throw error;
  },
  async signup(f) {
    const full_name = f.full_name.value.trim();
    const email = f.email.value.trim();
    const password = f.password.value;
    if (!full_name) throw { message: 'Enter your name.' };
    if (!email) throw { message: 'Enter your email.' };
    if (password.length < 8) throw { message: 'Password must be at least 8 characters.' };
    if (password !== f.confirm.value) throw { message: 'Passwords do not match.' };
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name }, emailRedirectTo: pageUrl() } });
    if (error) throw error;
    if (data.user && data.user.identities && data.user.identities.length === 0) {
      throw { message: 'An account with this email already exists. Log in instead.' };
    }
    if (data.session) return;
    state.pendingEmail = email;
    go('signupDone');
  },
  async forgot(f, msg) {
    const email = f.email.value.trim();
    if (!email) throw { message: 'Enter your email.' };
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl() });
    if (error) throw error;
    msg.textContent = 'If an account exists for ' + email + ', a reset link is on its way. Check your inbox.';
    msg.className = 'msg ok';
  },
  async reset(f) {
    const password = f.password.value;
    if (password.length < 8) throw { message: 'Password must be at least 8 characters.' };
    if (password !== f.confirm.value) throw { message: 'Passwords do not match.' };
    const { error } = await sb.auth.updateUser({ password });
    if (error) throw error;
    const { data } = await sb.auth.getSession();
    state.session = data.session;
    state.userId = data.session ? data.session.user.id : null;
    await loadProfile();
    toast('Password updated.', 'good');
    go('dashboard');
  }
};

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const msg = f.querySelector('.msg');
  const btn = f.querySelector('button[type=submit]');
  msg.textContent = ''; msg.className = 'msg';
  btn.disabled = true;
  try { await forms[f.dataset.form](f, msg); }
  catch (err) { msg.textContent = friendly(err); msg.className = 'msg err'; }
  finally { btn.disabled = false; }
});

/* ---------------- auth state ---------------- */
async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', state.userId).maybeSingle();
  state.profile = data || { full_name: '', email: state.session && state.session.user ? state.session.user.email : '', is_admin: false };
}
async function onAuth(event, session) {
  if (event === 'PASSWORD_RECOVERY') { state.session = session; state.view = 'reset'; render(); return; }
  if (event === 'SIGNED_OUT') {
    state.session = null; state.userId = null; state.profile = null; state.quiz = null; state.ed = null;
    go('login');
    return;
  }
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') {
    state.session = session;
    if (!session) { if (event === 'INITIAL_SESSION') go('login'); return; }
    if (state.view === 'reset') return;
    if (state.userId !== session.user.id) {
      state.userId = session.user.id;
      await loadProfile();
      go('dashboard');
    }
  }
}
sb.auth.onAuthStateChange((event, session) => { setTimeout(() => onAuth(event, session), 0); });

/* ---------------- dashboard ---------------- */
async function viewDashboard() {
  loading('dashboard');
  try {
    const rs = await Promise.all([
      sb.from('questionnaires').select('id,title,description,published_at,questions(count)').eq('status', 'published').order('published_at', { ascending: false }),
      sb.from('attempts').select('id,questionnaire_id,started_at,completed_at,score,attempt_answers(count)').eq('user_id', state.userId).order('started_at', { ascending: false })
    ]);
    const qns = unwrap(rs[0]);
    const atts = unwrap(rs[1]);
    if (state.view !== 'dashboard') return;
    const latest = {};
    atts.forEach(a => { if (!latest[a.questionnaire_id]) latest[a.questionnaire_id] = a; });

    const rows = qns.map(q => {
      const total = q.questions && q.questions[0] ? q.questions[0].count : 0;
      const a = latest[q.id];
      const answered = a ? (a.attempt_answers && a.attempt_answers[0] ? a.attempt_answers[0].count : 0) : 0;
      const done = a && a.completed_at;
      const pct = done ? 100 : (total ? Math.min(100, Math.round(answered / total * 100)) : 0);
      let label, actions;
      if (!total) {
        label = 'No questions yet';
        actions = '';
      } else if (done) {
        label = `Completed. Score <b>${a.score} of ${total}</b>`;
        actions = `<button class="btn btn-quiet" data-act="start" data-mode="results" data-id="${q.id}">View results</button>
                   <button class="btn btn-primary" data-act="start" data-mode="retake" data-id="${q.id}">Retake</button>`;
      } else if (a && answered > 0) {
        label = `<b>${answered} of ${total}</b> answered`;
        actions = `<button class="btn btn-primary" data-act="start" data-mode="continue" data-id="${q.id}">Continue</button>`;
      } else {
        label = `${total} question${total === 1 ? '' : 's'}`;
        actions = `<button class="btn btn-primary" data-act="start" data-mode="continue" data-id="${q.id}">Start</button>`;
      }
      return `<div class="test">
        <div>
          <h3>${esc(q.title)}</h3>
          ${q.description ? `<p class="desc">${esc(q.description)}</p>` : ''}
          <div class="progress-row">
            <div class="progress" role="progressbar" aria-label="Progress for ${esc(q.title)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
            <span class="label">${label}</span>
          </div>
        </div>
        <div class="test-actions">${actions}</div>
      </div>`;
    }).join('');

    const isAdmin = state.profile && state.profile.is_admin;
    const empty = `<div class="empty"><p>No tests are available yet.</p><p style="margin-top:.3rem">${isAdmin ? 'Open the Admin tab to upload and publish one.' : 'Check back soon.'}</p></div>`;
    app.innerHTML = shell(`
      <div class="page-head"><div><h1 class="page-title">My tests</h1><p class="muted">Pick a test to start, or continue where you left off.</p></div></div>
      ${rows ? `<div class="tests">${rows}</div>` : empty}`, 'dashboard');
  } catch (err) {
    app.innerHTML = shell(`<p class="msg err">${esc(friendly(err))}</p><button class="btn" data-act="go" data-view="dashboard">Try again</button>`, 'dashboard');
  }
}

/* ---------------- quiz ---------------- */
async function openQuiz(id, mode) {
  loading('dashboard');
  try {
    const rs = await Promise.all([
      sb.from('questionnaires').select('id,title').eq('id', id).single(),
      sb.from('questions').select('*').eq('questionnaire_id', id),
      sb.from('attempts').select('*').eq('questionnaire_id', id).eq('user_id', state.userId).order('started_at', { ascending: false }).limit(1)
    ]);
    const qn = unwrap(rs[0]), qs = unwrap(rs[1]), atts = unwrap(rs[2]);
    if (!qs.length) { toast('This test has no questions yet.', 'bad'); return go('dashboard'); }

    let attempt = atts[0];
    if (mode === 'retake' || !attempt || (attempt.completed_at && mode === 'continue')) {
      attempt = unwrap(await sb.from('attempts').insert({ user_id: state.userId, questionnaire_id: id }).select().single());
    }

    // Randomize question order based on the attempt ID (keeps order consistent if resumed later)
    const seed = hashCode(attempt.id);
    const randomizedQs = seededShuffle(qs, seed);

    const ans = unwrap(await sb.from('attempt_answers').select('question_id,chosen,is_correct').eq('attempt_id', attempt.id));
    const answers = new Map(ans.map(a => [a.question_id, a]));

    state.quiz = { qn, qs: randomizedQs, attempt, answers, idx: 0, selected: null, checked: false };
    if (mode === 'results' && attempt.completed_at) { go('results'); return; }

    const first = randomizedQs.findIndex(q => !answers.has(q.id));
    if (first === -1) { await finishAttempt(); return; }

    state.quiz.idx = first;
    go('quiz');
  } catch (err) {
    toast(friendly(err), 'bad');
    go('dashboard');
  }
}

function renderQuiz() {
  const qz = state.quiz;
  if (!qz) return go('dashboard');
  const total = qz.qs.length;
  const q = qz.qs[qz.idx];
  const answered = qz.answers.size;
  const pct = Math.round(answered / total * 100);
  const rec = qz.answers.get(q.id);
  const chosen = qz.checked && rec ? rec.chosen : qz.selected;
  const isLast = !qz.qs.some((x, i) => i > qz.idx && !qz.answers.has(x.id));

  const choices = LETTERS.map(L => {
    const text = q['choice_' + L.toLowerCase()];
    let cls = 'choice', tag = '';
    if (qz.checked) {
      if (L === q.correct_answer) { cls += ' correct'; tag = chosen === L ? 'Your answer, correct' : 'Correct answer'; }
      else if (L === chosen) { cls += ' wrong'; tag = 'Your answer'; }
    } else if (L === chosen) { cls += ' selected'; }
    return `<button class="${cls}" data-act="choose" data-letter="${L}" ${qz.checked ? 'disabled' : ''} aria-pressed="${L === chosen}">
      <span class="letter">${L}</span><span>${esc(text)}</span>${tag ? `<span class="tag">${tag}</span>` : '<span></span>'}
    </button>`;
  }).join('');

  let feedback = '';
  if (qz.checked && rec) {
    const good = rec.is_correct;
    feedback = `<div class="feedback ${good ? 'good' : 'miss'}" role="status">
      <strong>${good ? 'Correct.' : 'Not quite.'}</strong>
      ${good ? '' : `<p>The correct answer is ${q.correct_answer}: ${esc(q['choice_' + q.correct_answer.toLowerCase()])}</p>`}
      ${q.explanation ? `<p>${esc(q.explanation)}</p>` : ''}
    </div>`;
  }

  const action = qz.checked
    ? `<button class="btn btn-primary" id="nextBtn" data-act="next">${isLast ? 'See results' : 'Next question'}</button>`
    : `<button class="btn btn-primary" id="checkBtn" data-act="check" ${qz.selected ? '' : 'disabled'}>Check answer</button>`;

  app.innerHTML = `<main class="wrap main">
    <div class="quiz-top">
      <button class="btn btn-quiet" data-act="go" data-view="dashboard">Back to my tests</button>
      <span class="muted">Progress saves automatically</span>
    </div>
    <h1 class="quiz-title">${esc(qz.qn.title)}</h1>
    <div class="progress-row">
      <div class="progress" role="progressbar" aria-label="Test progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${answered}"><i style="width:${pct}%"></i></div>
      <span class="label">Question <b>${qz.idx + 1}</b> of ${total}</span>
    </div>
    <section class="qpanel">
      <p class="qtext">${esc(q.question)}</p>
      <div class="choices" role="group" aria-label="Answer choices">${choices}</div>
      ${feedback}
      <div class="qactions">${action}</div>
    </section>
  </main>`;
}

function choose(letter) {
  const qz = state.quiz;
  if (!qz || qz.checked || state.view !== 'quiz') return;
  qz.selected = letter;
  renderQuiz();
  const b = document.getElementById('checkBtn');
  if (b) b.focus();
}
async function checkAnswer() {
  const qz = state.quiz;
  if (!qz || !qz.selected || qz.checked || state.busy) return;
  state.busy = true;
  const q = qz.qs[qz.idx];
  try {
    const row = unwrap(await sb.from('attempt_answers')
      .insert({ attempt_id: qz.attempt.id, question_id: q.id, user_id: state.userId, chosen: qz.selected })
      .select('question_id,chosen,is_correct').single());
    qz.answers.set(q.id, row);
    qz.checked = true;
    renderQuiz();
    const b = document.getElementById('nextBtn');
    if (b) b.focus();
  } catch (err) {
    if (err && err.code === '23505') {
      toast('That question was already answered. Reloading your progress.', 'bad');
      state.busy = false;
      return openQuiz(qz.qn.id, 'continue');
    }
    toast('Could not save your answer. Check your connection and try again.', 'bad');
  } finally { state.busy = false; }
}
async function nextQuestion() {
  const qz = state.quiz;
  if (!qz || !qz.checked) return;
  qz.selected = null; qz.checked = false;
  const nxt = qz.qs.findIndex((q, i) => i > qz.idx && !qz.answers.has(q.id));
  try {
    if (nxt === -1) await finishAttempt();
    else { qz.idx = nxt; renderQuiz(); window.scrollTo(0, 0); }
  } catch (err) { toast(friendly(err), 'bad'); }
}
async function finishAttempt() {
  const qz = state.quiz;
  let score = 0;
  qz.answers.forEach(a => { if (a.is_correct) score++; });
  if (!qz.attempt.completed_at) {
    qz.attempt = unwrap(await sb.from('attempts').update({ completed_at: new Date().toISOString(), score }).eq('id', qz.attempt.id).select().single());
  }
  go('results');
}
function viewResults() {
  const qz = state.quiz;
  if (!qz) return go('dashboard');
  const total = qz.qs.length;
  const score = qz.attempt.score == null ? 0 : qz.attempt.score;
  const pct = total ? Math.round(score / total * 100) : 0;
  const missed = qz.qs.filter(q => { const a = qz.answers.get(q.id); return a && !a.is_correct; });
  const items = missed.map(q => {
    const a = qz.answers.get(q.id);
    const yours = a.chosen, right = q.correct_answer;
    return `<div class="miss-item">
      <p class="q">${esc(q.question)}</p>
      <p>Your answer: <span class="yours">${yours}: ${esc(q['choice_' + yours.toLowerCase()])}</span></p>
      <p class="right">Correct answer: ${right}: ${esc(q['choice_' + right.toLowerCase()])}</p>
      ${q.explanation ? `<p class="why"><b>Why:</b> ${esc(q.explanation)}</p>` : ''}
    </div>`;
  }).join('');

  app.innerHTML = shell(`<main class="wrap main">
    <div class="results">
      <div class="score">${score}<small> / ${total}</small></div>
      <p class="muted" style="font-size:1.2rem;margin-top:.5rem">You scored ${pct}%</p>
      <div class="row" style="justify-content:center">
        <button class="btn btn-primary" data-act="start" data-mode="retake" data-id="${qz.qn.id}">Retake test</button>
        <button class="btn" data-act="go" data-view="dashboard">Back to my tests</button>
      </div>
      ${missed.length ? `<div class="review"><h2>Review missed questions</h2>${items}</div>` : '<p style="margin-top:2rem" class="muted">Fantastic job! You got everything right.</p>'}
    </div>
  </main>`, 'dashboard');
}

/* ---------------- admin: CSV ---------------- */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(c => c.trim() !== '')) rows.push(row);
      row = [];
    } else field += ch;
  }
  row.push(field);
  if (row.some(c => c.trim() !== '')) rows.push(row);
  return rows;
}
function csvToQuestions(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw { message: 'The CSV needs a header row and at least one question.' };
  const head = rows[0].map(h => h.trim().toLowerCase().replace(/[\s-]+/g, '_'));
  const idx = n => head.indexOf(n);
  const need = ['question', 'choice_a', 'choice_b', 'choice_c', 'choice_d', 'correct_answer'];
  const miss = need.filter(n => idx(n) === -1);
  if (miss.length) throw { message: 'Missing column(s): ' + miss.join(', ') + '.' };
  return rows.slice(1).map(r => {
    const g = n => idx(n) === -1 ? '' : String(r[idx(n)] == null ? '' : r[idx(n)]).trim();
    let correct = g('correct_answer').toUpperCase().charAt(0);
    if (LETTERS.indexOf(correct) === -1) correct = '';
    return { key: newKey(), id: null, question: g('question'), a: g('choice_a'), b: g('choice_b'), c: g('choice_c'), d: g('choice_d'), correct, explanation: g('explanation') };
  });
}
function downloadTemplate() {
  const csv = 'question,choice_a,choice_b,choice_c,choice_d,correct_answer,explanation\n' +
    '"What is the capital of France?",Berlin,Madrid,Paris,Rome,C,"Paris is the capital and largest city of France."\n';
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'questions-template.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importCsv() {
  const file = document.getElementById('imp-file').files[0];
  if (!file) return toast('Choose a CSV file first.', 'bad');
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file.', 'bad');
  reader.onload = () => {
    try {
      const qs = csvToQuestions(String(reader.result));
      const title = document.getElementById('imp-title').value.trim() || file.name.replace(/\.[^.]+$/, '');
      const description = document.getElementById('imp-desc').value.trim();
      state.ed = { id: null, title, description, status: 'draft', qs, removed: [], errs: {} };
      toast(qs.length + ' question' + (qs.length === 1 ? '' : 's') + ' imported. Review, then save.', 'good');
      go('editor');
    } catch (err) { toast(friendly(err), 'bad'); }
  };
  reader.readAsText(file);
}
function blankTest() {
  const title = document.getElementById('imp-title').value.trim();
  const description = document.getElementById('imp-desc').value.trim();
  state.ed = { id: null, title, description, status: 'draft', qs: [blankQ()], removed: [], errs: {} };
  go('editor');
}
function blankQ() { return { key: newKey(), id: null, question: '', a: '', b: '', c: '', d: '', correct: '', explanation: '' }; }

/* ---------------- admin: editor ---------------- */
async function openEditor(id) {
  loading('admin');
  try {
    const rs = await Promise.all([
      sb.from('questionnaires').select('id,title,description,status').eq('id', id).single(),
      sb.from('questions').select('*').eq('questionnaire_id', id)
    ]);
    const qn = unwrap(rs[0]), qs = unwrap(rs[1]);
    qs.sort((x, y) => (x.position != null && y.position != null) ? x.position - y.position : String(x.created_at || '').localeCompare(String(y.created_at || '')));
    state.ed = {
      id: qn.id, title: qn.title || '', description: qn.description || '', status: qn.status,
      qs: qs.map(q => ({ key: newKey(), id: q.id, question: q.question || '', a: q.choice_a || '', b: q.choice_b || '', c: q.choice_c || '', d: q.choice_d || '', correct: q.correct_answer || '', explanation: q.explanation || '' })),
      removed: [], errs: {}
    };
    go('editor');
  } catch (err) { toast(friendly(err), 'bad'); go('admin'); }
}

function viewEditor() {
  const ed = state.ed;
  if (!ed || !isAdmin()) return go('admin');
  const cards = ed.qs.map((q, i) => {

    }).join('');
    return `<div class="qcard ${err ? 'has-err' : ''}" data-key="${q.key}">
      <div class="qcard-head"><h3>Question ${i + 1}</h3><button class="btn btn-sm btn-danger" data-act="ed-del-q" data-key="${q.key}">Remove</button></div>
      <div class="field"><label>Question</label><textarea data-f="question">${esc(q.question)}</textarea></div>
      <fieldset><legend>Choices (select the correct one)</legend>${choiceRows}</fieldset>
      <div class="field" style="margin-bottom:0"><label>Explanation (optional)</label><textarea data-f="explanation">${esc(q.explanation)}</textarea></div>
      ${err ? `<p class="qerr">${esc(err)}</p>` : ''}

  }).join('');

  app.innerHTML = shell(`
    <div class="page-head">
      <div><h1 class="page-title">${ed.id ? 'Edit test' : 'New test'}${ed.id ? `<span class="pill ${ed.status === 'published' ? 'pub' : 'draft'}">${ed.status === 'published' ? 'Published' : 'Draft'}</span>` : ''}</h1></div>
      <button class="btn btn-quiet" data-act="ed-back">Back to admin</button>
    </div>
    <section class="panel">
      <div class="field"><label for="ed-title">Test title</label><input id="ed-title" type="text" data-ed="title" value="${esc(ed.title)}"></div>
      <div class="field" style="margin-bottom:0"><label for="ed-desc">Description (optional)</label><input id="ed-desc" type="text" data-ed="description" value="${esc(ed.description)}"></div>
    </section>
    ${cards || '<div class="empty">No questions yet. Add one below.</div>'}
    <div class="row" style="margin-top:.5rem"><button class="btn" data-act="ed-add-q">Add question</button></div>
    <div class="savebar">
      <span class="muted">${ed.qs.length} question${ed.qs.length === 1 ? '' : 's'}</span>
      <div class="row">
        <button class="btn" data-act="ed-save" data-mode="keep">Save</button>
        ${ed.status === 'published'
          ? `<button class="btn btn-primary" data-act="ed-save" data-mode="keep">Save changes</button>`
          : `<button class="btn btn-primary" data-act="ed-save" data-mode="publish">Save and publish</button>`}
      </div>
    </div>`, 'admin');
}

function onEditField(e) {
  const ed = state.ed;
  const el = e.target;
  if (!ed || state.view !== 'editor') return;
  if (el.dataset.ed) { ed[el.dataset.ed] = el.value; return; }
  const f = el.dataset.f;
  if (!f) return;
  const card = el.closest('.qcard');
  if (!card) return;
  const q = ed.qs.find(x => x.key === card.dataset.key);
  if (!q) return;
  if (f === 'correct') { if (el.checked) q.correct = el.value; }
  else q[f] = el.value;
}
document.addEventListener('input', onEditField);
document.addEventListener('change', onEditField);

async function saveEditor(mode) {
  const ed = state.ed;
  if (!ed || state.busy) return;
  ed.errs = {};
  const title = ed.title.trim();
  if (!title) { toast('Give the test a title first.', 'bad'); return; }
  if (!ed.qs.length) { toast('Add at least one question.', 'bad'); return; }
  let bad = 0;
  ed.qs.forEach((q, i) => {
    const probs = [];
    if (!q.question.trim()) probs.push('the question text');
    LETTERS.forEach(L => { if (!q[L.toLowerCase()].trim()) probs.push('choice ' + L); });
    if (!q.correct) probs.push('the correct answer');
    if (probs.length) { ed.errs[q.key] = 'Missing: ' + probs.join(', ') + '.'; bad++; }
  });
  if (bad) {
    viewEditor();
    toast(bad + ' question' + (bad === 1 ? ' needs' : 's need') + ' attention.', 'bad');
    const first = document.querySelector('.qcard.has-err');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  state.busy = true;
  document.querySelectorAll('.savebar .btn').forEach(b => { b.disabled = true; });
  try {
    const status = mode === 'publish' ? 'published' : ed.status;
    const base = { title, description: ed.description.trim() || null, status };
    if (status === 'published' && ed.status !== 'published') base.published_at = new Date().toISOString();

    if (ed.id) {
      unwrap(await sb.from('questionnaires').update(base).eq('id', ed.id).select().single());
    } else {
      const row = unwrap(await sb.from('questionnaires').insert(base).select().single());
      ed.id = row.id;
    }
    ed.status = status;

    const toRow = q => ({ questionnaire_id: ed.id, question: q.question.trim(), choice_a: q.a.trim(), choice_b: q.b.trim(), choice_c: q.c.trim(), choice_d: q.d.trim(), correct_answer: q.correct, explanation: q.explanation.trim() || null });

    if (ed.removed.length) {
      unwrap(await sb.from('questions').delete().in('id', ed.removed));
      ed.removed = [];
    }
    for (const q of ed.qs.filter(x => x.id)) {
      unwrap(await sb.from('questions').update(toRow(q)).eq('id', q.id).select().single());
    }
    const fresh = ed.qs.filter(x => !x.id);
    if (fresh.length) {
      const inserted = unwrap(await sb.from('questions').insert(fresh.map(toRow)).select('id'));
      fresh.forEach((q, i) => { if (inserted[i]) q.id = inserted[i].id; });
    }
    toast(status === 'published' ? 'Saved and published.' : 'Saved.', 'good');
    state.busy = false;
    if (mode === 'publish') { state.ed = null; go('admin'); }
    else viewEditor();
  } catch (err) {
    state.busy = false;
    toast(friendly(err), 'bad');
    viewEditor();
  }
}

async function togglePublish(id, isPub, total) {
  if (!isPub && Number(total) === 0) return toast('Add questions before publishing.', 'bad');
  try {
    const patch = isPub ? { status: 'draft' } : { status: 'published', published_at: new Date().toISOString() };
    unwrap(await sb.from('questionnaires').update(patch).eq('id', id).select().single());
    toast(isPub ? 'Unpublished.' : 'Published.', 'good');
    viewAdmin();
  } catch (err) { toast(friendly(err), 'bad'); }
}
async function deleteTest(id, title) {
  if (!window.confirm('Delete "' + title + '" and all its questions and user attempts? This cannot be undone.')) return;
  try {
    unwrap(await sb.from('questionnaires').delete().eq('id', id).select());
    toast('Deleted.', 'good');
    viewAdmin();
  } catch (err) { toast(friendly(err), 'bad'); }
}

/* ---------------- global action router ---------------- */
function render() {
  if (!state.session) {
    if (['signup', 'signupDone', 'forgot', 'reset'].includes(state.view)) {
      if (state.view === 'signup') viewSignup();
      else if (state.view === 'signupDone') viewSignupDone();
      else if (state.view === 'forgot') viewForgot();
      else if (state.view === 'reset') viewReset();
    } else {
      viewLogin();
    }
    return;
  }
  if (state.view === 'dashboard') viewDashboard();
  else if (state.view === 'quiz') renderQuiz();
  else if (state.view === 'results') viewResults();
  else if (state.view === 'admin') viewAdmin();
  else if (state.view === 'editor') viewEditor();
  else viewDashboard();
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'go') go(btn.dataset.view);
  else if (act === 'signout') sb.auth.signOut();
  else if (act === 'start') openQuiz(btn.dataset.id, btn.dataset.mode);
  else if (act === 'choose') choose(btn.dataset.letter);
  else if (act === 'check') checkAnswer();
  else if (act === 'next') nextQuestion();
  /* admin */
  else if (act === 'import-csv') importCsv();
  else if (act === 'blank-test') blankTest();
  else if (act === 'dl-template') downloadTemplate();
  else if (act === 'ed-open') openEditor(btn.dataset.id);
  else if (act === 'ed-back') {
    if (window.confirm('Leave this page? Unsaved changes will be lost.')) { state.ed = null; go('admin'); }
  }
  else if (act === 'ed-add-q') {
    state.ed.qs.push(blankQ());
    viewEditor();
    const cards = document.querySelectorAll('.qcard');
    if (cards.length) cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (act === 'ed-del-q') {
    const ed = state.ed;
    const i = ed.qs.findIndex(q => q.key === btn.dataset.key);
    if (i > -1) {
      const [q] = ed.qs.splice(i, 1);
      if (q.id) ed.removed.push(q.id);
      delete ed.errs[q.key];
      viewEditor();
    }
  }
  else if (act === 'ed-save') saveEditor(btn.dataset.mode);
  else if (act === 'toggle-pub') togglePublish(btn.dataset.id, btn.dataset.pub === '1', btn.dataset.total);
  else if (act === 'del-test') deleteTest(btn.dataset.id, btn.dataset.title);
});

})();
</script>
